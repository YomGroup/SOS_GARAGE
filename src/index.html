<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SOS MON GARAGE</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SOS Mon Garage - Gestion des sinistres auto & moto">
    <meta name="theme-color" content="#aa38cb">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <base href="/">
    
    <!-- Preconnect pour optimiser le chargement des fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Polices modernes -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Polyfill pour les bibliothèques Node.js (SockJS, STOMP) -->
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
      if (typeof Buffer === 'undefined') {
        window.Buffer = { isBuffer: function() { return false; } };
      }
    </script>
    
    <!-- Styles pour l'écran de chargement -->
    <style>
      :root {
        --primary-blue: #004aad;
        --primary-purple: #aa38cb;
      }
      
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        z-index: 9999;
      }
      
      .app-loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 2rem;
        animation: pulse-logo 2s ease-in-out infinite;
      }
      
      .app-loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(170, 56, 203, 0.15);
        border-top-color: var(--primary-purple);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }
      
      .app-loading-text {
        font-size: 1rem;
        font-weight: 500;
        color: #64748b;
        animation: fade-text 1.5s ease-in-out infinite;
      }
      
      .app-loading-brand {
        margin-top: 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-purple) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.05em;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      
      @keyframes fade-text {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
    </style>
  </head>

  <body class="mat-typography">
    <app-root>
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">Chargement en cours...</div>
        <div class="app-loading-brand">SOS MON GARAGE</div>
      </div>
    </app-root>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('expanded');
      }

      window.addEventListener('DOMContentLoaded', () => {
        if (window.innerWidth <= 768) {
          const sidebar = document.getElementById('sidebar');
          const mainContent = document.getElementById('mainContent');
          if (sidebar) sidebar.classList.add('collapsed');
          if (mainContent) mainContent.classList.add('expanded');
        }
      });
    </script>
    <script>
      function selectVehicleStatus(status) {
        if (status === 'roulant') {
          window.location.href = '/clientDashboard/roulant';
        } else if (status === 'nonroulant') {
          window.location.href = '/clientDashboard/nonroulant';
        }
      }
    </script>
    <script>
      let currentStep = 1;
      const totalSteps = 4;

      function nextStep(step) {
        if (validateStep(step)) {
          showStep(step + 1);
        }
      }

      function prevStep(step) {
        showStep(step - 1);
      }

      function showStep(step) {
        document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.step').forEach(s => {
          s.classList.remove('active');
          s.classList.remove('completed');
        });

        const formStep = document.getElementById(`formStep${step}`);
        const stepIndicator = document.getElementById(`step${step}`);
        
        if (formStep) formStep.classList.add('active');
        if (stepIndicator) stepIndicator.classList.add('active');

        for (let i = 1; i < step; i++) {
          const prevStep = document.getElementById(`step${i}`);
          if (prevStep) prevStep.classList.add('completed');
        }

        currentStep = step;
      }
    </script>
  </body>
</html>
