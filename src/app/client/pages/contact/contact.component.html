<div class="contact-page">

  <!-- HERO -->
  <section class="contact-hero">
    <div class="contact-hero-bg-top"></div>
    <div class="contact-hero-bg-bottom"></div>

    <div class="page-container contact-hero-inner">
      <span class="contact-badge">
        <span class="contact-badge-text">Contact</span>
      </span>

      <h1 class="contact-hero-title">
        Besoin d'aide ?<br />
        <span class="contact-hero-gradient">
          Contactez-nous
        </span>
      </h1>

      <p class="contact-hero-subtitle">
        Notre équipe est à votre disposition pour répondre à toutes vos questions.
      </p>
    </div>
  </section>

  <!-- CARTES INFOS CONTACT -->
  <section class="contact-infos" id="contact-info">
    <div class="page-container">
      <div class="contact-info-grid">
        <div
          class="contact-card"
          *ngFor="let info of contactInfo; let i = index"
        >
          <div class="contact-card-icon-wrapper">
            <div class="contact-card-icon-bg">
              <span class="contact-card-icon">{{ info.icon }}</span>
            </div>
          </div>

          <h3 class="contact-card-title">
            {{ info.title }}
          </h3>

          <p class="contact-card-value">
            {{ info.value }}
          </p>

          <p class="contact-card-desc">
            {{ info.description }}
          </p>
        </div>
      </div>
    </div>
  </section>
